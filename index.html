<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الموقع تحت الصيانة</title>
    <style>
        /* ===== Reset & Base ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #0b0e1a 0%, #1a1f33 100%);
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* ===== Animated Background Orbs ===== */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.25;
            pointer-events: none;
            z-index: 0;
            animation: floatOrb 12s ease-in-out infinite alternate;
        }
        .orb--1 {
            width: 500px;
            height: 500px;
            background: #7c5cfc;
            top: -150px;
            right: -100px;
            animation-delay: 0s;
        }
        .orb--2 {
            width: 400px;
            height: 400px;
            background: #fc5c7c;
            bottom: -100px;
            left: -80px;
            animation-delay: 4s;
        }
        .orb--3 {
            width: 300px;
            height: 300px;
            background: #5cfc9e;
            top: 40%;
            left: 50%;
            transform: translateX(-50%);
            animation-delay: 8s;
            opacity: 0.12;
        }

        @keyframes floatOrb {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(40px, -40px) scale(1.15);
            }
        }

        /* ===== Main Card ===== */
        .card {
            position: relative;
            z-index: 1;
            max-width: 780px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 48px;
            padding: 54px 44px 48px;
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            text-align: center;
            transition: all 0.3s ease;
        }

        /* ===== Icon / Logo ===== */
        .icon-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 96px;
            height: 96px;
            border-radius: 28px;
            background: linear-gradient(135deg, rgba(124, 92, 252, 0.25), rgba(252, 92, 124, 0.18));
            border: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 28px;
            font-size: 44px;
            animation: pulseIcon 2.4s ease-in-out infinite;
        }

        @keyframes pulseIcon {
            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(124, 92, 252, 0.2);
            }
            50% {
                transform: scale(1.04);
                box-shadow: 0 0 40px 8px rgba(124, 92, 252, 0.15);
            }
        }

        /* ===== Typography ===== */
        .badge {
            display: inline-block;
            background: rgba(124, 92, 252, 0.18);
            color: #b8a8ff;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            padding: 6px 20px;
            border-radius: 100px;
            border: 1px solid rgba(124, 92, 252, 0.15);
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        h1 {
            color: #ffffff;
            font-size: 38px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 14px;
        }
        h1 span {
            background: linear-gradient(135deg, #b8a8ff, #ff8a9e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtext {
            color: rgba(255, 255, 255, 0.6);
            font-size: 18px;
            font-weight: 400;
            line-height: 1.7;
            max-width: 500px;
            margin: 0 auto 32px;
        }

        /* ===== Timer ===== */
        .timer-grid {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .timer-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 14px 10px 10px;
            min-width: 80px;
            flex: 0 1 80px;
            backdrop-filter: blur(4px);
            transition: border-color 0.3s;
        }
        .timer-item:hover {
            border-color: rgba(124, 92, 252, 0.3);
        }

        .timer-item .number {
            display: block;
            font-size: 44px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
            line-height: 1.1;
            font-variant-numeric: tabular-nums;
        }
        .timer-item .label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.35);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-top: 4px;
        }

        .separator {
            display: flex;
            align-items: center;
            color: rgba(255, 255, 255, 0.12);
            font-size: 32px;
            font-weight: 300;
            padding: 0 2px;
            user-select: none;
        }

        /* ===== Progress Bar ===== */
        .progress-wrap {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            overflow: hidden;
            margin: 12px 0 24px;
        }
        .progress-bar {
            height: 100%;
            width: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, #7c5cfc, #fc5c7c);
            transition: width 1s linear;
        }

        /* ===== Status Message ===== */
        .status-msg {
            font-size: 15px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.3px;
        }
        .status-msg strong {
            color: rgba(255, 255, 255, 0.8);
            font-weight: 600;
        }

        /* ===== COMPLETED STATE ===== */
        .card.completed .icon-wrap {
            animation: none;
            background: linear-gradient(135deg, rgba(92, 252, 158, 0.2), rgba(92, 220, 252, 0.15));
            border-color: rgba(92, 252, 158, 0.2);
        }
        .card.completed .badge {
            background: rgba(92, 252, 158, 0.15);
            color: #7cfcb8;
            border-color: rgba(92, 252, 158, 0.2);
        }
        .card.completed h1 span {
            background: linear-gradient(135deg, #7cfcb8, #5cfcfc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .card.completed .timer-grid {
            opacity: 0.4;
            pointer-events: none;
            filter: grayscale(0.6);
        }
        .card.completed .progress-bar {
            background: linear-gradient(90deg, #5cfc9e, #5cfcfc);
        }

        .complete-msg {
            display: none;
            margin-top: 6px;
            font-size: 20px;
            font-weight: 600;
            color: #7cfcb8;
            animation: fadeUp 0.8s ease forwards;
        }
        .card.completed .complete-msg {
            display: block;
        }
        .card.completed .status-msg {
            display: none;
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== Responsive ===== */
        @media (max-width: 600px) {
            .card {
                padding: 34px 22px 32px;
                border-radius: 32px;
            }
            h1 {
                font-size: 28px;
            }
            .subtext {
                font-size: 15px;
            }
            .timer-item {
                min-width: 64px;
                flex: 0 1 64px;
                padding: 10px 6px 8px;
            }
            .timer-item .number {
                font-size: 32px;
            }
            .timer-item .label {
                font-size: 11px;
            }
            .separator {
                font-size: 22px;
                padding: 0 0px;
            }
            .timer-grid {
                gap: 10px;
            }
            .icon-wrap {
                width: 72px;
                height: 72px;
                font-size: 34px;
                border-radius: 20px;
            }
        }

        @media (max-width: 400px) {
            .timer-item {
                min-width: 52px;
                flex: 0 1 52px;
                padding: 8px 4px 6px;
            }
            .timer-item .number {
                font-size: 26px;
            }
            .timer-grid {
                gap: 6px;
            }
            .separator {
                font-size: 16px;
            }
            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <!-- Animated orbs -->
    <div class="orb orb--1"></div>
    <div class="orb orb--2"></div>
    <div class="orb orb--3"></div>

    <!-- Main Card -->
    <div class="card" id="mainCard" role="main" aria-live="polite">

        <!-- Icon -->
        <div class="icon-wrap">🛠️</div>

        <!-- Badge -->
        <div class="badge" id="statusBadge">جاري الصيانة</div>

        <!-- Heading -->
        <h1>الموقع <span>تحت الصيانة</span></h1>

        <!-- Description -->
        <p class="subtext">
            نعمل على تحسين تجربتك. سنعود قريباً بإطلالة جديدة ومميزة.
        </p>

        <!-- Timer -->
        <div class="timer-grid" id="timerGrid">
            <div class="timer-item">
                <span class="number" id="hours">03</span>
                <span class="label">ساعات</span>
            </div>
            <span class="separator">:</span>
            <div class="timer-item">
                <span class="number" id="minutes">00</span>
                <span class="label">دقائق</span>
            </div>
            <span class="separator">:</span>
            <div class="timer-item">
                <span class="number" id="seconds">00</span>
                <span class="label">ثواني</span>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="progress-wrap">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <!-- Status -->
        <div class="status-msg" id="statusMsg">
            الوقت المتبقي: <strong id="remainingLabel">3 ساعات</strong>
        </div>
        <div class="complete-msg" id="completeMsg">
            ✨ انتهت الصيانة! الموقع جاهز الآن ✨
        </div>

    </div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            //  CONFIG
            // ============================================================
            const TOTAL_SECONDS = 3 * 60 * 60; // 3 hours

            // DOM refs
            const card = document.getElementById('mainCard');
            const hoursEl = document.getElementById('hours');
            const minutesEl = document.getElementById('minutes');
            const secondsEl = document.getElementById('seconds');
            const progressBar = document.getElementById('progressBar');
            const statusMsg = document.getElementById('statusMsg');
            const remainingLabel = document.getElementById('remainingLabel');
            const badge = document.getElementById('statusBadge');

            // ============================================================
            //  STATE
            // ============================================================
            let startTime = Date.now();
            let remaining = TOTAL_SECONDS;
            let timerInterval = null;
            let isCompleted = false;
            let hasExpiredOnce = false; // prevent repeated completion triggers

            // ============================================================
            //  HELPERS
            // ============================================================
            function pad(n) {
                return String(n).padStart(2, '0');
            }

            function formatTime(sec) {
                const h = Math.floor(sec / 3600);
                const m = Math.floor((sec % 3600) / 60);
                const s = Math.floor(sec % 60);
                return { hours: h, minutes: m, seconds: s };
            }

            function updateDisplay(sec) {
                const { hours, minutes, seconds } = formatTime(sec);
                hoursEl.textContent = pad(hours);
                minutesEl.textContent = pad(minutes);
                secondsEl.textContent = pad(seconds);

                // progress (0 → 1)
                const progress = 1 - (sec / TOTAL_SECONDS);
                const pct = Math.min(100, Math.max(0, progress * 100));
                progressBar.style.width = pct + '%';

                // human-readable remaining label
                if (sec >= 3600) {
                    const h = Math.floor(sec / 3600);
                    const m = Math.floor((sec % 3600) / 60);
                    if (m === 0) {
                        remainingLabel.textContent = h + ' ساعة' + (h > 1 ? 'ات' : '');
                    } else {
                        remainingLabel.textContent = h + ' ساعة و ' + m + ' دقيقة' + (m > 1 ? 'ق' : '');
                    }
                } else if (sec >= 60) {
                    const m = Math.floor(sec / 60);
                    remainingLabel.textContent = m + ' دقيقة' + (m > 1 ? 'ق' : '');
                } else {
                    remainingLabel.textContent = Math.ceil(sec) + ' ثانية' + (Math.ceil(sec) > 1 ? 'ات' : '');
                }
            }

            // ============================================================
            //  COMPLETION
            // ============================================================
            function setCompleted() {
                if (isCompleted) return;
                isCompleted = true;
                hasExpiredOnce = true;

                // stop timer
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }

                // update UI
                card.classList.add('completed');
                badge.textContent = '✅ اكتملت الصيانة';
                hoursEl.textContent = '00';
                minutesEl.textContent = '00';
                secondsEl.textContent = '00';
                progressBar.style.width = '100%';
                remainingLabel.textContent = 'انتهت';
                statusMsg.style.display = 'none';

                // show completion message (already shown via CSS)
                // dispatch a custom event if needed
                document.dispatchEvent(new CustomEvent('maintenanceComplete'));
            }

            // ============================================================
            //  TICK
            // ============================================================
            function tick() {
                const now = Date.now();
                const elapsed = (now - startTime) / 1000;
                let secLeft = Math.max(0, TOTAL_SECONDS - elapsed);

                // clamp to 0
                if (secLeft < 0) secLeft = 0;

                remaining = secLeft;
                updateDisplay(secLeft);

                // check completion
                if (secLeft <= 0 && !isCompleted) {
                    setCompleted();
                }
            }

            // ============================================================
            //  INIT
            // ============================================================
            function init() {
                // If page is loaded with a stored start time? We'll just start fresh.
                // But we want to be resilient: if user refreshes, timer resets to 3h.
                // That's acceptable for a maintenance page.

                startTime = Date.now();
                remaining = TOTAL_SECONDS;
                isCompleted = false;
                hasExpiredOnce = false;
                card.classList.remove('completed');
                badge.textContent = '🛠️ جاري الصيانة';
                statusMsg.style.display = 'block';

                // initial display
                updateDisplay(TOTAL_SECONDS);

                // clear any old interval
                if (timerInterval) {
                    clearInterval(timerInterval);
                }

                // start ticker (update every 250ms for smoothness)
                timerInterval = setInterval(tick, 250);

                // immediate tick to catch edge cases
                tick();
            }

            // ============================================================
            //  HANDLE VISIBILITY CHANGE (pause/resume if needed)
            // ============================================================
            // We keep it simple: even when tab is hidden, we keep counting.
            // But we can recalc on visibility change to avoid drift.
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden && !isCompleted) {
                    // re-sync on visibility change
                    tick();
                }
            });

            // ============================================================
            //  START
            // ============================================================
            init();

            // Expose for debugging (optional)
            window.__maintenance = {
                reset: init,
                getRemaining: () => remaining,
                isCompleted: () => isCompleted,
            };

            console.log('🛠️ صفحة الصيانة – تنتهي تلقائياً بعد 3 ساعات.');
        })();
    </script>

</body>
</html>
